<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EasierDataBases{% endblock %}</title>
    <script>
        (() => {
            const storedTheme = localStorage.getItem("edb-theme");
            const theme = storedTheme || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
            document.documentElement.dataset.theme = theme;
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    {% load static %}
    <link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}">
    <link rel="stylesheet" href="{% static 'styles/app.css' %}">
</head>
<body>
    <header class="site-header site-header-fixed">
        <div class="site-header-inner">
            <a class="brand" href="{% url 'home' %}">EasierDataBases</a>
            <nav class="top-nav">
                <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Cambiar tema">Modo oscuro</button>
                {% if request.user.is_authenticated %}
                    <a href="{% url 'dashboard' %}">Dashboard</a>
                    <form action="{% url 'logout' %}" method="post">
                        {% csrf_token %}
                        <button type="submit" class="link-button">Salir</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}">Ingresar</a>
                    <a class="button subtle" href="{% url 'register' %}">Crear cuenta</a>
                {% endif %}
            </nav>
        </div>
    </header>
    <div class="page-shell">

        {% if messages %}
            <section class="messages">
                {% for message in messages %}
                    <div class="message {{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </section>
        {% endif %}

        <main>
            {% block content %}{% endblock %}
        </main>
    </div>
    <script>
        (() => {
            const root = document.documentElement;
            const toggle = document.getElementById("theme-toggle");
            if (!toggle) {
                return;
            }

            const syncLabel = () => {
                const isDark = root.dataset.theme === "dark";
                toggle.textContent = isDark ? "Modo claro" : "Modo oscuro";
                toggle.setAttribute("aria-label", isDark ? "Activar modo claro" : "Activar modo oscuro");
            };

            toggle.addEventListener("click", () => {
                root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
                localStorage.setItem("edb-theme", root.dataset.theme);
                syncLabel();
            });

            syncLabel();
        })();
    </script>
    <script>
        (() => {
            const STORAGE_KEY = "edb-scroll-restore";
            const BASES_PREFIX = "/bases/";

            const isDatabasePage = (pathname) => pathname.startsWith(BASES_PREFIX);

            const currentPath = window.location.pathname;

            const restoreScroll = () => {
                if (!isDatabasePage(currentPath)) {
                    return;
                }

                const raw = sessionStorage.getItem(STORAGE_KEY);
                if (!raw) {
                    return;
                }

                let payload;
                try {
                    payload = JSON.parse(raw);
                } catch (error) {
                    sessionStorage.removeItem(STORAGE_KEY);
                    return;
                }

                if (!payload || payload.y === undefined || !payload.timestamp) {
                    sessionStorage.removeItem(STORAGE_KEY);
                    return;
                }

                if (Date.now() - payload.timestamp > 15000) {
                    sessionStorage.removeItem(STORAGE_KEY);
                    return;
                }

                sessionStorage.removeItem(STORAGE_KEY);

                const scrollToSavedPosition = () => {
                    window.scrollTo({ top: Number(payload.y) || 0, left: 0, behavior: "auto" });
                };

                window.requestAnimationFrame(() => {
                    scrollToSavedPosition();
                    window.setTimeout(scrollToSavedPosition, 60);
                });
            };

            const registerForms = () => {
                if (!isDatabasePage(currentPath)) {
                    return;
                }

                document.querySelectorAll("form").forEach((form) => {
                    form.addEventListener("submit", () => {
                        sessionStorage.setItem(
                            STORAGE_KEY,
                            JSON.stringify({
                                y: window.scrollY,
                                timestamp: Date.now(),
                            }),
                        );
                    });
                });
            };

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", () => {
                    restoreScroll();
                    registerForms();
                });
            } else {
                restoreScroll();
                registerForms();
            }
        })();
    </script>
</body>
</html>
