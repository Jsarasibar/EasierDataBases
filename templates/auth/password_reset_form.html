{% extends "base.html" %}

{% block title %}Recuperar contraseña{% endblock %}

{% block content %}
<section class="auth-card">
    <div>
        <span class="eyebrow">Acceso</span>
        <h1>Recuperar contraseña</h1>
        <p>Ingresa tu email y te enviaremos un enlace para volver a entrar.</p>
    </div>
    <form method="post" class="stack-form">
        {% csrf_token %}
        {% for field in form %}
            <label class="field">
                <span>{{ field.label }}</span>
                {{ field }}
                {{ field.errors }}
            </label>
        {% endfor %}
        <button type="submit" class="button">Enviar enlace</button>
    </form>
</section>
{% endblock %}
