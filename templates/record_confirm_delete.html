{% extends "base.html" %}

{% block title %}Eliminar registro{% endblock %}

{% block content %}
<section class="panel narrow">
    <div class="panel-head">
        <span class="eyebrow">{{ database.name }}</span>
        <h1>Eliminar registro definitivamente</h1>
        <p>Vas a eliminar <strong>{{ record.title }}</strong>. Esta accion no se puede deshacer.</p>
    </div>
    <form method="post" class="hero-actions">
        {% csrf_token %}
        <button type="submit" class="button danger">Eliminar definitivamente</button>
        <a class="button subtle" href="{% url 'database_detail' database.slug %}">Cancelar</a>
    </form>
</section>
{% endblock %}
